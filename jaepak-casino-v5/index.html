/* JAEPARK CASINO V6: single-screen responsive mobile + desktop layout */
:root{--ticker-h:26px;--header-h:52px;--nav-h:62px;--scene-gap:5px;--viewport-pad:11px}
html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.app{width:min(100%,510px);max-width:100%;height:100dvh;min-height:0;display:grid;grid-template-rows:var(--ticker-h) var(--header-h) minmax(0,1fr) var(--nav-h);overflow:hidden;background:radial-gradient(ellipse at 50% 33%,#184732 0%,#071f19 55%,#02120f 100%);isolation:isolate}
.app.show-landing{grid-template-rows:var(--ticker-h) var(--header-h) minmax(0,1fr)}
.app:before{background:radial-gradient(circle at 50% 0%,rgba(222,182,97,.14),transparent 36%),linear-gradient(90deg,rgba(4,15,12,.7),transparent 17%,transparent 83%,rgba(4,15,12,.7)),repeating-linear-gradient(110deg,transparent 0 36px,rgba(255,213,120,.012) 37px 38px,transparent 39px 73px);z-index:0}
.ticker{height:var(--ticker-h);grid-row:1;font-size:11px;z-index:5;box-shadow:0 2px 6px #0008}
.header{height:var(--header-h);grid-row:2;padding:0 13px}
.crest{width:28px;height:33px;font-size:20px}
.brand{font-size:12px;gap:7px;letter-spacing:.6px}
.wallet{font-size:11px;padding:7px 9px}
.view,.app.show-landing .view{grid-row:3;height:auto!important;min-height:0!important;overflow:hidden!important;padding:var(--viewport-pad);padding-bottom:calc(var(--viewport-pad) + 1px);scrollbar-width:none;contain:layout}
.view>.fade{height:100%;min-height:0;max-width:850px;margin:0 auto}
.nav{position:relative;grid-row:4;bottom:auto;left:auto;right:auto;height:auto;padding:3px 8px max(4px,env(safe-area-inset-bottom));z-index:7}
.nav button{font-size:11px;gap:1px;min-width:0}
.nav button b{font-size:22px;line-height:1.1}
.nav button:focus-visible,.guide:focus-visible,.gold-btn:focus-visible,.dark-btn:focus-visible,.red-btn:focus-visible{outline:2px solid #fff7bb;outline-offset:2px}
.section-title{font-size:clamp(19px,5vw,24px);margin:4px 0 8px;line-height:1.24}
.small-label{font-size:10px;letter-spacing:1.1px}
.gold-btn,.dark-btn,.red-btn{min-height:44px;padding:9px 12px;font-size:14px;line-height:1.3}

<b style="color:var(--gold);font-size:19px">${name}</b><button class="guide" onclick="gameGuide('${id}')">?</button></div>`};function betBar(){return `<div class="panel" style="padding:10px;margin:12px 0"><div class="row between"><span class="muted">베팅 금액</span><div class="row"><button class="guide" onclick="adjustBet(-1)">−</button><b>${fmt(state.chip)}칩</b><button class="guide" onclick="adjustBet(1)">+</button></div></div></div>`};const betOptions=[1000,5000,10000,50000,100000,500000,1000000];function adjustBet(d){state.chip=betOptions[Math.max(0,Math.min(betOptions.length-1,betOptions.indexOf(state.chip)+d))];renderGame()};function renderGame(){let id=state.activeGame;if(id==='slots')return renderSlot();if(id==='holdem')return renderHoldem();if(id==='roulette')return renderRoulette();if(id==='blackjack')return renderBlackjack();if(id==='baccarat')return renderBaccarat();if(id==='odd'||id==='sicbo')return renderDice(id)};function renderRoulette(){let nums=Array.from({length:12},(_,i)=>`<button class="${state.selected===String(i)?'chosen':''}" onclick="chooseBet('${i}')">${i}</button>`).join('');view(`<div class="game-stage">${stageHeading('✦ 로얄 룰렛 ✦','roulette')}<div class="small-label">EUROPEAN ROULETTE · SINGLE ZERO</div><div class="roulette" id="rouletteWheel"><div class="inner"></div><span class="ball" id="ball"></span></div><div class="panel"><div class="mini-title">베팅 위치 선택</div><div class="bet-grid"><button class="red ${state.selected==='빨강'?'chosen':''}" onclick="chooseBet('빨강')">빨강</button><button class="black ${state.selected==='검정'?'chosen':''}" onclick="chooseBet('검정')">검정</button><button onclick="chooseBet('0')">0</button><button onclick="chooseBet('홀')">홀</button><button onclick="chooseBet('짝')">짝</button><button onclick="chooseBet('1~18')">1~18</button>${nums}</div><div class="muted">선택: ${state.selected} · 배당: ${/^[0-9]+$/.test(state.selected)?'35:1':'1:1'}</div></div>${betBar()}<button id="action" class="gold-btn full" onclick="spinRoulette()">⟳ 룰 r.map((c,i)=>cardHtml(c,i===1&&bj.phase==='playing')).join('')||cardHtml({v:14,s:'♠'},true)}</div><div class="art-table" style="height:182px;margin:15px 0"><div style="position:relative;padding-top:20px"><div class="mini-title">플레이어 · ${bj.player.length?valueHand(bj.player):'-'}점</div><div class="cards">${bj.player.map(c=>cardHtml(c)).join('')}</div></div></div>${betBar()}<div id="result" class="mini-title"></div><div class="actions">${bj.phase==='playing'?`<button class="gold-btn" onclick="bjHit()">히트</button><button class="red-btn" onclick="bjStand()">스탠드</button>`:`<button class="gold-btn full" onclick="bjStart()">${bj.phase==='bet'?'카드 받기':'다시 플레이'}</button>`}</div></div>`)}function bjStart(){if(state.money<state.chip)return alert('칩 부족');changeMoney(-state.chip);bj={dealer:[getCard(),getCard()],player:[getCard(),getCard()],phase:'playing'};sound('chip');renderBlackjack()}function bjHit(){bj.player.push(getCard());sound('chip');if(valueHand(bj.player)>21){bj.phase='over';renderBlackjack();$('result').textContent='버스트! 딜러 승리';return}renderBlackjack()}function bjStand(){while(valueHand(bj.dealer)<17)bj.dealer.push(getCard());let p=valueHand(bj.player),d=valueHand(bj.dealer),win=d>21||p>d,tie=d===p;bj.phase='over';if(win)changeMoney(state.chip*2);if(tie)changeMoney(state.chip);renderBlackjack();$('result').textContent=win?'🎉 승리! 2배 지급':tie?'무승부 · 베팅액 반환':'딜러 승리';if(win){sound('win');setTicker(state.name+'님이 블랙잭 승리!')}}let bac={p:[],b:[],result:''};function renderBaccarat(){view(`<div>${stageHeading('♦ 로얄 바카라 ♦','baccarat')}<div class="dealer-scene"><div class="dealer-figure">🃏</div></div><div class="art-table" style="height:260px;display:flex;justify-content:space-around;align-items:center"><div style="text-align:center;z-index:1"><b>PLAYER</b><div class="cards">${bac.p.map(c=>cardHtml(c)).join('')||cardHtml({v:8,s:'♥'},true)}</div></div><div style="text-align:center;z-index:1"><b>BANKER</b><div class="cards">${bac.b.map(c=>cardHtml(c)).join('')||cardHtml({v:8,s:'♥'},true)}</div></div></div><div class="bet-grid"><button class="${state.selected==='플레이어'?'chosen':''}" onclick="state.selected='플레이어';renderBaccarat()">플레이어</button><button class="${state.selected==='타이'?'chosen':''}" onclick="state.selected='타이';renderBaccarat()">타이</button><button class="${state.selected==='뱅커'?'chosen':''}" onclick="state.selected='뱅커';renderBaccarat()">뱅커</button></div>${betBar()}<button class="gold-btn full" onclick="dealBaccarat()">베팅하고 카드 배분</button><div class="mini-title">${bac.result}</div></div>`)}function dealBaccarat(){if(state.money<state.chip)return alert('칩 부족');changeMoney(-state.chip);bac.p=[getCard(),getCard()];bac.b=[getCard(),getCard()];let p=bac.p.reduce((s,c)=>s+Math.min(c.v,10)%10,0)%10,b=bac.b.reduce((s,c)=>s+Math.min(c.v,10)%10,0)%10;if(p<6&&b<8){if(p<=5)bac.p.push(getCard());if(b<=5)bac.b.push(getCard())}p=bac.p.reduce((s,c)=>s+Math.min(c.v,10)%10,0)%10;b=bac.b.reduce((s,c)=>s+Math.min(c.v,10)%10,0)%10;const result=p===b?'타이':p>b?'플레이어':'뱅커';const win=state.selected===result;const payout=win?state.chip*(result==='타이'?9:result==='뱅커'?1.95:2):0;changeMoney(payout);bac.result=`${result} 승리 (${p}:${b}) ${win?'· +'+fmt(payout)+'칩':'· 미당첨'}`;if(win)sound('win');renderBaccarat()}function renderDice(id){const sic=id==='sicbo';view(`<div>${stageHeading(sic?'✦ 식보 SIC BO ✦':'✦ 홀짝 다이스 ✦',id)}<div class="art-table" style="height:230px;display:grid;place-items:center"><div id="dice" style="font-size:98px;filter:drop-shadow(0 6px 10px #000);position:relative;z-index:1">${sic?'🎲🎲🎲':'🎲'}</div></div><div class="bet-grid">${(sic?['소','대','홀','짝']:['홀','짝']).map(x=>`<button class="${state.selected===x?'chosen':''}" onclick="state.selected='${x}';renderDice('${id}')">${x}</button>`).join('')}</div>${betBar()}<button class="gold-btn full" id="diceAction" onclick="rollDice('${id}')">주사위 굴리기</button><div id="diceResult" class="mini-title"></div></div>`)}function rollDice(id){if(state.money<state.chip)return alert('칩 부족');changeMoney(-state.chip);const count=id==='sicbo'?3:1;let r=Array.from({length:count},()=>1+Math.floor(Math.random()*6)),total=r.reduce((a,b)=>a+b,0);$('dice').style.animation='slowrotate .6s linear';$('diceAction').disabled=true;sound('spin');setTimeout(()=>{const small=total>=4&&total<=10&&!r.every(x=>x===r[0]);const large=total>=11&&total<=17&&!r.every(x=>x===r[0]);let win=state.selected==='홀'&&total%2===1||state.selected==='짝'&&total%2===0||state.selected==='소'&&small||state.selected==='대'&&large;const payout=win?state.chip*1.95:0;changeMoney(payout);$('dice').textContent=r.map(v=>['⚀','⚁','⚂','⚃','⚄','⚅'][v-1]).join(' ');$('dice').style.animation='';$('diceResult').textContent=`${r.join('+')} = ${total} · ${win?'승리 +'+fmt(payout)+'칩':'미당첨'}`;$('diceAction').disabled=false;if(win)sound('win')},850)}
const members=[{name:'지연',icon:'👩🏻',status:'online',chips:4980000},{name:'민수',icon:'👨🏻',status:'online',chips:5420000},{name:'현우',icon:'👦🏻',status:'busy',chips:4230000},{name:'도윤',icon:'🧑🏻',status:'online',chips:3760000},{name:'세라',icon:'👩🏼',status:'offline',chips:3510000}];let poker={phase:'waiting',round:0,players:3,deck:[],private:[],board:[],pot:0,bets:0};function seats(){let px=[['민수','👨🏻'],['지연','👩🏻'],['도윤','🧑🏻'],['현우','👦🏻'],[state.name||'나','🙋']];return px.map(([n,face],i)=>`<div class="seat s${i} ${i===4?'me':''}" style="${i>=poker.players-1&&i!==4?'opacity:.42':''}"><div class="face">${i<poker.players-1||i===4?face:'+'}</div><div class="name"><span class="online-dot ${i>=poker.players-1&&i!==4?'off-dot':''}"></span> ${i<poker.players-1||i===4?n:'빈자리'}</div></div>`).join('')};function renderHoldem(){let started=poker.phase!=='waiting';view(`<div>${stageHeading('♠ 텍사스 홀덤 ♠','holdem')}<div class="row between"><div class="pill">2~5인 플레이 · ${poker.players}명</div><button class="dark-btn" style="min-height:36px;padding:5px 13px" onclick="invitePlayers()">＋ 친구 초대</button></div><div class="poker-table">${seats()}<div class="community">${poker.board.map(c=>cardHtml(c)).join('')}</div><div class="pot">🪙 팟 ${fmt(poker.pot)} 칩</div><div class="my-cards">${started?poker.private.map(c=>cardHtml(c)).join(''):cardHtml({v:14,s:'♠'},true)+cardHtml({v:14,s:'♠'},true)}</div></div><div class="panel" style="padding:10px"><div class="row between"><b>${started?['프리플롭','플롭','턴','리버','쇼다운'][poker.round]:'프라이빗 테이블'}</b><span class="muted">${started?'차례: '+state.name:'참가자를 초대하고 시작'}</span></div>${started?`<div class="chip-row" style="margin:6px 0">${[1000,5000,10000,50000,100000].map(v=>`<button class="${state.betChoice===v?'selected':''}" onclick="state.betChoice=${v};renderHoldem()">${v>=10000?v/10000+'만':v/1000+'천'}</button>`).join('')}</div><div class="actions"><button class="red-btn" onclick="pokerAct('fold')">폴드</button><button class="dark-btn" onclick="pokerAct('call')">콜</butto const rMultiplier=choice=>/^\d+$/.test(choice)?36:['1~12','13~24','25~36'].includes(choice)?3:2;

const rPotential=choice=>rouletteBets.filter(b=>b.choice===choice).reduce((v,b)=>v+b.amt*rMultiplier(b.choice),0);
function rPocket(choice,extra='',sty=''){
 const b=rouletteBets.filter(x=>x.choice===choice),cnt=b.length;
 return `<button class="r-pocket ${extra} ${cnt?'staked':''}" style="${sty}" data-roulette-choice="${choice}" onclick="rPlace('${choice}')" title="${choice} · ${rMultiplier(choice)}배 지급">${choice}${cnt?`<span class="stack-label">${cnt}</span>`:''}</button>`;
}
const rHeader=title=>`<div class="r-head"><button class="r-control" aria-label="게임 목록" onclick="backGame()">‹</button><b>${title}</b><button class="r-control" aria-label="게임 방법" onclick="gameGuide('roulette')">?</button></div>`;

renderRoulette=function(){
 const cells=Array.from({length:36},(_,i)=>{const col=Math.floor(i/3),row=i%3,n=col*3+row+1;return rPocket(String(n),R_RED.has(n)?'red':'black',`grid-column:${col+1};grid-row:${3-row}`)}).join('');
 const extra=['빨강','검정','홀','짝','1~18','19~36'].map(n=>rPocket(n,n==='빨강'?'red':n==='검정'?'black':'')).join('');

 <button class="gold-btn full r-start" id="action" onclick="spinRoulette()" ${rouletteRunning||!rouletteBets.length?'disabled':''}>${rouletteRunning?'🎡 룰렛 회전 중...':'✦ ROULETTE SPIN ✦'}</button><div class="r-result" id="result">${rouletteResult||betList}</div>
 </div></div>`);

function rPick(v){rouletteChip=v;for(const b of document.querySelectorAll('.r-denom')){b.classList.toggle('selected',Number(b.dataset.chip)===v)}}
function rPlace(pos){if(rouletteRunning)return;const next=rTotal()+rouletteChip;if(next>state.money){alert('보유 칩이 부족합니다.');return;}rouletteBets.push({choice:String(pos),amt:rouletteChip});rouletteLatestBet=String(pos);rouletteResult='';renderRoulette();}

let rGhost=null,rDragOrigin=null;
