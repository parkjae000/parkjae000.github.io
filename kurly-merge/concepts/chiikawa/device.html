<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>모바일 시안 검수</title><style>body{margin:0;min-height:100dvh;background:#b9a6ad;display:grid;place-items:center}iframe{border:0;border-radius:18px;box-shadow:0 15px 60px #66515b55}</style><iframe title="치이카와 모바일 시안"></iframe><script>const q=new URLSearchParams(location.search),f=document.querySelector('iframe');f.style.width=Math.max(320,Math.min(460,Number(q.get('w'))||390))+'px';f.style.height=Math.max(600,Math.min(1000,Number(q.get('h'))||844))+'px';f.src='index.html'+(['early','checkpoint'].includes(q.get('scene'))?'?scene='+q.get('scene'):'');</script></html>
