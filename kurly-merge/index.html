<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#713cac"><meta name="description" content="일용직을 합성하고 물류센터를 개척하는 컬리 머지센터. 파트장과 함께 작업장을 복구하고 친구들과 채팅과 물량 랭킹을 즐겨 보세요."><title>컬리 머지센터</title><link rel="icon" href="assets/parcel.webp"><link rel="manifest" href="manifest.webmanifest"><link rel="preload" as="image" href="assets/warehouse-backdrop.webp"><link rel="stylesheet" href="style.css?v=100"><script type="module" src="app.mjs?v=100"></script></head><body>
<div id="app" class="app">
 <section id="welcome" class="welcome"><div class="welcome-light"></div><div class="brand-mark">KURLY MERGE CENTER</div><h1>컬리<br><span>머지센터</span></h1><p class="welcome-copy">작은 일용직들이 만드는<br>커다란 물류센터 이야기</p><img class="welcome-worker" src="assets/worker-cute.webp" alt="곡괭이를 든 양 일용직"><img class="welcome-pile" src="assets/pile-parcel.webp" alt="보라색 리본 박스"><div class="auth-card"><div class="auth-tabs"><button data-auth="register" class="active">새 센터 시작</button><button data-auth="login">이어하기</button></div><form id="auth-form"><label>센터장 닉네임<input id="nickname" name="nickname" maxlength="14" autocomplete="username" placeholder="2~14자 닉네임" required></label><label>접속 PIN<input id="pin" name="pin" type="password" inputmode="numeric" minlength="6" maxlength="12" autocomplete="new-password" placeholder="숫자 6~12자리" required></label><button id="auth-submit" class="gold-button" type="submit">센터 문 열기</button><p class="auth-note">닉네임과 PIN으로 다른 기기에서도 이어할 수 있어요.</p><p id="auth-error" class="form-error" role="alert"></p></form></div><div class="welcome-footer">합성하고 · 길을 열고 · 함께 성장해요</div></section>
 <main id="game" class="game hidden">
  <header class="hud"><div class="hud-top"><button id="profile" class="profile"><img src="assets/worker-cute.webp" alt=""><span><small id="player-name">센터장</small><b id="stage-name">제1작업구역</b></span></button><button id="settings-button" class="round-button" aria-label="설정"></button></div><div class="currencies"><span class="currency gold"><i id="gold-icon"></i><b id="gold">0</b></span><button class="currency research" data-panel="cards"><i id="elixir-icon"></i><b id="elixir">0</b></button><button class="currency gems" data-panel="shop"><i id="gems-icon"></i><b id="gems">0</b><span class="plus">+</span></button></div></header>
  <div id="event-strip" class="event-strip"><span id="mode-label">상온센터 · 신규 작업구역</span><button data-panel="events"><span class="event-spark">✦</span> 물량전 <span id="event-clock"></span></button></div>
  <section id="mine" class="mine"><div id="board-scroll" class="board-scroll"><canvas id="board" aria-label="일용직을 드래그해서 박스를 처리하고 같은 레벨끼리 합성하는 작업장" role="img"></canvas></div><div class="floating left"><button id="supply-button" class="float-button" data-panel="supply"><img src="assets/supply-chest.webp" alt=""><span>보급</span><b id="supply-dot" class="badge hidden">!</b></button><button class="float-button" data-panel="quests"><span class="float-icon" id="quest-icon"></span><span>일일 업무</span></button><button class="float-button" data-panel="treasure"><span class="float-icon" id="treasure-icon"></span><span>보물찾기</span></button></div><div class="floating right"><button id="hero-skill" class="float-button hero-skill"><img id="hero-thumb" src="assets/hero-ambient.webp" alt="파트장 지원"><span id="skill-label">파트장 지원</span></button><button id="auto-button" class="float-button"><span class="float-icon" id="auto-icon"></span><span id="auto-label">연속 작업</span></button><button id="bomb-button" class="float-button"><img src="assets/dynamite.webp" alt=""><span id="bomb-label">돌파 도구</span></button></div><div id="tutorial" class="tutorial hidden"><button id="tutorial-close" aria-label="도움말 닫기">×</button><b id="tutorial-title"></b><span id="tutorial-copy"></span><button id="tutorial-next">다음</button></div><div id="selection" class="selection hidden"></div><button id="next-zone" class="next-zone hidden">다음 작업구역 개방</button><div id="map-message" class="map-message hidden"></div></section>
  <div id="facility-dock" class="facility-dock"></div>
  <section class="hire-dock"><button id="delivery-button" class="delivery-button"><img src="assets/delivery-cannon.webp" alt=""><span id="delivery-label">무료 배달</span><b id="delivery-clock">준비 중</b></button><button id="hire-button" class="hire-button"><img src="assets/worker-cute.webp" alt=""><span><b id="hire-title">일용직 채용</b><small id="hire-price">45 골드</small></span><span id="hire-level">Lv.1</span></button><button id="merge-help" class="crew-button"><span id="crew-icon"></span><b id="worker-count">3/8</b></button></section>
  <button id="chat-peek" class="chat-peek"><span id="chat-icon"></span><span id="chat-preview">센터장들과 이야기를 나눠 보세요.</span><b>채팅</b></button>
  <nav class="bottom-nav"><button data-tab="mine" class="active"><span id="nav-mine"></span><b>작업장</b></button><button data-panel="cards"><span id="nav-cards"></span><b>연구</b></button><button data-panel="heroes"><span id="nav-heroes"></span><b>파트장</b></button><button data-panel="rankings"><span id="nav-rank"></span><b>랭킹</b></button><button data-panel="shop"><span id="nav-shop"></span><b>상점</b></button></nav>
 </main>
 <div id="modal-layer" class="modal-layer hidden"><section id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header class="modal-header"><div><small id="modal-eyebrow">MERGE CENTER</small><h2 id="modal-title"></h2></div><button id="modal-close" class="round-button" aria-label="닫기">×</button></header><div id="modal-body" class="modal-body"></div></section></div>
 <div id="toast" class="toast hidden" role="status"></div><div id="busy" class="connection hidden" role="status">센터에 연결하고 있어요…</div>
 <div id="truck-screen" class="truck-screen hidden"><header><b>지게차 보너스</b><span id="truck-time">30</span><button id="truck-skip">건너뛰기</button></header><canvas id="truck-canvas"></canvas><div class="truck-hint">좌우로 움직여 보급품을 모아요</div><div class="truck-controls"><button id="truck-left" aria-label="왼쪽으로 이동">‹</button><button id="truck-right" aria-label="오른쪽으로 이동">›</button></div></div>
</div></body></html>
