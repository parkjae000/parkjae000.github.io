<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><meta name="color-scheme" content="only light"><meta name="theme-color" content="#f4e8d5"><meta name="description" content="택배를 채굴하고 센터를 성장시키며 친구들과 대결하는 물류센터 점령 게임"><title>컬리 아포칼립스 | 박스의 반란</title><link rel="preload" as="image" href="assets/scene-title.webp"><link rel="stylesheet" href="style.css?v=20261123-v214-combat-guide"><link rel="stylesheet" href="immersive.css?v=20261123-v214-combat-guide"><link rel="stylesheet" href="polish.css?v=20261123-v214-combat-guide"><link rel="stylesheet" href="rebellion.css?v=20261123-v214-combat-guide"><link rel="stylesheet" href="expedition.css?v=20261123-v214-combat-guide"><link rel="stylesheet" href="progression.css?v=20261123-v214-combat-guide"><link rel="stylesheet" href="cards.css?v=20261123-v214-combat-guide"><link rel="stylesheet" href="onboarding.css?v=20261123-v214-combat-guide"><link rel="stylesheet" href="notice.css?v=20261123-v214-combat-guide"><link rel="stylesheet" href="growth.css?v=20261123-v214-combat-guide"><link rel="stylesheet" href="combat.css?v=20261123-v214-combat-guide"><link rel="stylesheet" href="animated.css?v=20261123-v214-combat-guide"><link rel="stylesheet" href="notifications.css?v=20261123-v214-combat-guide"><link rel="stylesheet" href="chat.css?v=20261123-v214-combat-guide"><link rel="stylesheet" href="supplies.css?v=20261123-v214-combat-guide"></head>
<body>
<div id="auth" class="screen-auth">
 <div class="auth-shine"></div>
 <div class="auth-inner">
  <div class="eyebrow">복슬이의 독립 물류센터</div><h1>컬리<br><span>아포칼립스</span></h1>
  <p class="auth-sub">센터는 커져도 월급은 제자리.<br>윗사람들의 센터를 접수하라!</p>
  <div class="auth-entry"><button class="btn btn-gold" id="enterSignup">새로 시작하기</button><button class="btn btn-outline" id="enterLogin">이어서 하기</button></div><div class="auth-card"><button type="button" id="titleBack" class="auth-back">닫기 ✕</button>
   <div class="auth-switch"><button id="signupTab" class="active" type="button">새 계정 만들기</button><button id="loginTab" type="button">기존 계정 로그인</button></div>
   <form id="authForm" autocomplete="off">
    <label for="worldField">서버 코드 <small>같은 코드끼리 경쟁해요</small></label><input id="worldField" maxlength="12" required placeholder="예: NIGHT-TEAM" autocapitalize="characters" spellcheck="false">
    <label for="nickField">닉네임</label><input id="nickField" maxlength="12" minlength="2" required placeholder="사용할 닉네임" autocomplete="username">
    <label for="pinField">6자리 PIN</label><input id="pinField" type="password" maxlength="6" minlength="6" pattern="[0-9]{6}" inputmode="numeric" required placeholder="••••••" autocomplete="off">
    <button id="authSubmit" class="btn btn-gold btn-wide" type="submit">센터 운영 시작</button>
   </form>
   <p class="auth-help">계정은 서버 코드·닉네임·PIN으로 구분해요. PIN을 잊으면 현재 버전에서는 복구할 수 없으니 꼭 기억해 주세요.</p>
  </div>
  <div class="demo-badges"><span>⚒ 채굴·합성</span><span>🛡 센터 성장</span><span>⚔ 비동기 전쟁</span></div>
  <p class="legal">실제 금전·환전 없는 가상 전략게임 · 비공식 팬 패러디 프로젝트 · 실제 기업과 무관</p>
 </div>
</div>
<div id="adminApp" class="admin-app hidden"></div>
<div id="app" class="app hidden">
 <header class="app-header">
  <div class="header-top"><div class="brand-mini"><div class="logo-mini">📦</div><div><strong>컬리 아포칼립스</strong><small id="serverLabel">서버 연결 중</small></div></div><div class="header-tools"><button data-notices title="공지사항" aria-label="공지사항" class="iconbtn">📣</button><button data-events title="이벤트" aria-label="이벤트" class="iconbtn">🎁<b class="attention-badge" data-event-badge hidden></b></button><button id="mailBtn" title="우편함" class="iconbtn mail-button">✉<b data-mail-badge hidden></b></button><button id="guideBtn" title="스토리와 가이드" class="iconbtn">❔</button><button id="profileBtn" title="프로필" class="profilebtn">👤</button></div></div>
  <div class="resbar"><button id="boxResource" class="resbox"><span><img class="parcel-inline" src="assets/parcel.webp" alt="택배 상자"></span><strong id="boxCount">0</strong><small class="sr-only">박스</small></button><button id="cashResource" class="resbox rare"><span>💰</span><strong id="cashCount">0</strong><small>돈 · 상점 </small></button><button class="powerbox" type="button" data-power-details aria-label="전투력 계산 방법 보기"><small>전투력</small><strong id="powerCount">0</strong></button></div>
 </header>
 <main id="main"><section id="tabCenter" class="tab-page"></section><section id="tabMine" class="tab-page hidden"></section><section id="tabWar" class="tab-page hidden"></section><section id="tabShop" class="tab-page hidden"></section><section id="tabServer" class="tab-page hidden"></section></main>
 <nav class="navbar" aria-label="메인 탭"><button data-tab="center" class="navitem selected"><span>🏢</span><small>내 센터</small></button><button data-tab="mine" class="navitem"><span>⛏️</span><small>택배 채굴</small><b class="attention-badge" data-mine-badge hidden>!</b></button><button data-tab="war" class="navitem"><span>⚔️</span><small>출정</small><b class="attention-badge" data-war-badge hidden></b></button><button data-tab="shop" class="navitem"><span>🛒</span><small>상점</small></button><button data-tab="server" class="navitem"><span>🏆</span><small>서버</small><b class="attention-badge" data-chat-badge hidden></b></button></nav>
</div>
<div id="recruitOverlay" class="recruit-overlay hidden" role="dialog" aria-modal="true" aria-label="파트장 모집 연출"></div>
<div id="trainingNavCue" class="training-nav-cue hidden" aria-hidden="true">여기</div>
<div id="trainingCoach" class="training-coach hidden" role="region" aria-label="센터 운영 실습 안내" aria-live="polite"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modalOverlay" class="overlay hidden"><div id="modalContent" class="modal-content"></div></div>
<div id="onboardOverlay" class="onboard-overlay hidden"><div class="onboard-wrap"><div id="onboardContent"></div><div class="onboard-actions"><button id="onboardSkip" class="btn btn-outline">건너뛰기</button><span id="onboardCounter">1 / 9</span><button id="onboardNext" class="btn btn-gold">다음</button></div></div></div>
<div id="battleTransition" class="battle-transition hidden" aria-label="전투 시작 일러스트"></div>
<div id="battleResult" class="battle-result hidden" role="dialog" aria-modal="true" aria-label="전투 결과"></div><div id="zoneTransition" class="zone-transition hidden" aria-label="다음 구역 이동 연출"></div>
