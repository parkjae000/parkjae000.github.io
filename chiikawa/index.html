<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="only light"><meta name="theme-color" content="#514044"><title>치이카와 간식 동굴</title><meta name="description" content="친구를 합치고 간식 동굴을 개척하세요. 진행 저장, 채팅과 랭킹을 지원하는 모바일 채굴 게임."><link rel="stylesheet" href="style.css?v=122"><script type="importmap">{"imports":{"./economy.mjs":"./economy.mjs?v=123","./game.mjs":"./game.mjs?v=123","./session.mjs":"./session.mjs?v=123"}}</script><script type="module" src="app.mjs?v=123"></script></head><body><section id="welcome" aria-labelledby="welcome-title"><div class="welcome-scene" aria-hidden="true"><span class="welcome-spark">✦</span><span class="welcome-cart"></span><span class="welcome-worker"></span></div><div class="auth-card"><p class="eyebrow">작은 친구들의 커다란 모험</p><h1 id="welcome-title">치이카와<br><strong>간식 동굴</strong></h1><p class="welcome-copy">캐고, 합치고, 함께 경쟁해요.</p><div class="auth-tabs" role="group" aria-label="시작 방식"><button type="button" data-auth-mode="register" aria-pressed="true">처음 시작</button><button type="button" data-auth-mode="login" aria-pressed="false">이어하기</button></div><form id="auth-form" method="post"><label for="nickname">닉네임</label><input id="nickname" name="nickname" autocomplete="username" minlength="2" maxlength="14" pattern="[가-힣a-zA-Z0-9_ ]{2,14}" placeholder="친구들에게 보여줄 이름" required><label for="pin">로그인 PIN <small>숫자 6~12자리</small></label><div class="pin-field"><input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="new-password" pattern="[0-9]{6,12}" minlength="6" maxlength="12" placeholder="기억할 수 있는 숫자 암호" required><button id="toggle-pin" type="button" aria-label="PIN 표시">보기</button></div><p id="auth-error" role="alert" hidden></p><button id="auth-submit" type="submit" disabled>모험 시작하기</button></form><p id="auth-loading" role="status" hidden>저장된 진행을 불러오고 있어요…</p><button id="retry-connection" type="button" class="dialog-button" hidden>다시 연결</button><p class="auth-note">닉네임과 PIN으로 다른 기기에서도 이어 할 수 있어요.<br>PIN을 잊지 않도록 기억해 주세요.</p></div><p class="welcome-foot">합성 · 채굴 · 생산 · 친구들과의 순위 경쟁</p></section><main id="app" hidden><header class="hud"><div class="balances"><span><i id="coin"></i><b id="gold">0</b></span><span><i id="potion"></i><b id="elixir">0</b></span><span><i id="gem"></i><b id="gems">0</b><button data-panel="shop" aria-label="보석 상점">+</button></span></div><div class="status"><button id="scene-toggle" aria-label="내 진행 정보"><span class="tiny-pick">✦</span><b id="scene-name">간식 동굴 2</b><span id="save-state" aria-label="저장 상태">✓</span></button><div id="work-status"><span id="work-count">작업 중</span><button id="clear-selection" aria-label="친구 선택 해제" hidden></button></div><button type="button" class="crew" data-panel="crew" aria-label="친구 정원"><i id="crew-icon"></i><b id="crew-count">3/8</b></button><button id="chat-button" data-panel="chat" aria-label="친구들과 채팅"></button><button id="settings" data-panel="menu" aria-label="센터 메뉴"></button></div></header><section id="world" aria-label="간식 동굴 작업장"><canvas id="scene" role="img" aria-label="간식 동굴 작업장"></canvas><div id="structures"></div></section><section id="charges" aria-label="별사탕 폭죽" hidden><b>별사탕 폭죽</b><div id="charge-items"></div><small id="charge-tip"></small></section><footer class="toolbar original-toolbar" aria-label="채굴 메뉴"><button class="nav supplies" data-panel="shop" aria-label="상점"><span class="asset chest"></span><b>상점</b></button><button class="nav cards-nav" data-panel="cards" aria-label="카드 연구"><i id="research-icon"></i><b>카드</b></button><button id="hire" aria-label="친구 채용"><span class="hire-top"><b id="hire-level">LV.1</b><span id="hire-portrait" class="asset"></span></span><span class="hire-price"><i id="hire-coin"></i><b id="hire-cost">0</b></span></button><button id="wheel-button" class="nav wheel-nav" data-panel="wheel" aria-label="행운 룰렛"><i id="wheel-icon"></i><b id="wheel-count">0/5</b></button><button class="nav event-nav" id="event-button" data-panel="events" aria-label="오늘의 업무"><b>오늘의 업무</b><i id="event-icon"></i><small id="event-clock">0/4</small></button></footer><dialog id="dialog"><header><h1 id="dialog-title"></h1><button id="close-dialog" aria-label="닫기">×</button></header><div id="dialog-content"></div></dialog><div id="notice" class="sr-only" role="status" aria-atomic="true"></div></main><noscript>이 게임을 플레이하려면 자바스크립트를 켜 주세요.</noscript></body></html>
